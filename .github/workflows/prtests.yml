name: grid-core PR tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASSWORD: grid_test
          POSTGRES_DB: grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid_test -d grid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      CREDITS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      PAYOUTS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      VALIDATORS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      VALIDATOR_SHADOW_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Verify production dependency lock
        run: |
          uv pip compile requirements-grid.txt \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --no-emit-index-url \
            --custom-compile-command 'uv pip compile requirements-grid.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-emit-index-url --output-file requirements-grid.lock' \
            --output-file requirements-grid.lock
          git diff --exit-code -- requirements-grid.lock
      - name: Install deps
        run: >-
          pip install --require-hashes --only-binary=:all:
          -r requirements-grid.lock && pip install pytest pytest-asyncio
      - name: Audit production dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r requirements-grid.lock --require-hashes --no-deps --disable-pip
      - name: Validator anti-gaming contract
        run: >-
          python -m pytest
          grid_api/routers/tests/test_validator_anti_gaming.py -q
      - name: Retired runtime gate
        run: python scripts/check_retired_runtime.py
      - name: Validate operations scripts
        run: |
          bash -n scripts/backup_postgres.sh scripts/prove_postgres_restore.sh
          grep -qx 'Group=aipg' deploy/systemd/aipg-postgres-backup.service
          # System Chrome is not a dependency of the PostgreSQL/shell checks.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -Fq 'dl.google.com/linux/chrome' "$source"; then
              echo "Excluding unused Chrome source: $source"
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client shellcheck redis-server
          shellcheck -x scripts/backup_postgres.sh scripts/prove_postgres_restore.sh deploy/bootstrap.sh
      - name: Backup and restored migration proof
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASS: grid_test
          POSTGRES_URL: 127.0.0.1:5432/grid_test
          AIPG_RESTORE_ADMIN_USER: grid_test
          AIPG_RESTORE_ADMIN_PASS: grid_test
          AIPG_RESTORE_RUN_AS_CURRENT_USER: '1'
        run: |
          alembic upgrade 0019
          PGPASSWORD="$POSTGRES_PASS" psql \
            --host=127.0.0.1 \
            --username="$POSTGRES_USER" \
            --dbname=grid_test \
            --command='CREATE SCHEMA backup_excluded; CREATE TABLE backup_excluded.must_not_ship(id integer);'
          backup_dir="$RUNNER_TEMP/aipg-postgres-backup"
          AIPG_BACKUP_DIR="$backup_dir" scripts/backup_postgres.sh
          backup="$(find "$backup_dir" -maxdepth 1 -name 'grid-postgres-*.dump' -print -quit)"
          if pg_restore --list "$backup" | grep -q 'backup_excluded'; then
            echo 'backup unexpectedly contains a non-Grid schema' >&2
            exit 1
          fi
          AIPG_RESTORE_BACKUP="$backup" \
            AIPG_RESTORE_CANDIDATE="$GITHUB_WORKSPACE" \
            AIPG_RESTORE_PYTHON="$(command -v python)" \
            scripts/prove_postgres_restore.sh
      - name: Migration and schema parity
        run: |
          alembic upgrade head
          alembic check
      - name: Offline test suite (grid_api)
        run: python -m pytest grid_api -q
      - name: Checkout reviewed validator client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-validator
          ref: 1c3b812236a7937824217170d95df184517228b9
          path: .integration/validator
          persist-credentials: false
      - name: Checkout reviewed Console client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-frontend
          ref: 28dbf5f348a077ed7ed163ea8e081a1eae5445a1
          path: .integration/console
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build pinned Console for local consent integration
        working-directory: .integration/console
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Real PostgreSQL Core Console node compensation handoff
        env:
          VALIDATOR_NODE_SOURCE: ${{ github.workspace }}/.integration/validator
          VALIDATOR_CONSOLE_SOURCE: ${{ github.workspace }}/.integration/console
        run: python -m pytest grid_api/services/tests/test_validator_compensation_handoff.py -q
