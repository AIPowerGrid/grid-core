name: grid-core tests

on:
  push:
    branches:
      - main
    paths:
      - 'grid_api/**'
      - 'alembic/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'requirements-grid.lock'
      - '.github/workflows/maintests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASSWORD: grid_test
          POSTGRES_DB: grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid_test -d grid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      CREDITS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      PAYOUTS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      VALIDATORS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Verify production dependency lock
        run: |
          uv pip compile requirements-grid.txt \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --no-emit-index-url \
            --custom-compile-command 'uv pip compile requirements-grid.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-emit-index-url --output-file requirements-grid.lock' \
            --output-file requirements-grid.lock
          git diff --exit-code -- requirements-grid.lock
      - name: Install deps
        run: >-
          pip install --require-hashes --only-binary=:all:
          -r requirements-grid.lock && pip install pytest pytest-asyncio
      - name: Audit production dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r requirements-grid.lock --require-hashes --no-deps --disable-pip
      - name: Retired runtime gate
        run: python scripts/check_retired_runtime.py
      - name: Validate operations scripts
        run: |
          bash -n scripts/backup_postgres.sh scripts/prove_postgres_restore.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client shellcheck
          shellcheck -x scripts/backup_postgres.sh scripts/prove_postgres_restore.sh deploy/bootstrap.sh
      - name: Backup and restored migration proof
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASS: grid_test
          POSTGRES_URL: 127.0.0.1:5432/grid_test
          AIPG_RESTORE_ADMIN_USER: grid_test
          AIPG_RESTORE_ADMIN_PASS: grid_test
          AIPG_RESTORE_RUN_AS_CURRENT_USER: '1'
        run: |
          alembic upgrade 0019
          backup_dir="$RUNNER_TEMP/aipg-postgres-backup"
          AIPG_BACKUP_DIR="$backup_dir" scripts/backup_postgres.sh
          backup="$(find "$backup_dir" -maxdepth 1 -name 'grid-postgres-*.dump' -print -quit)"
          AIPG_RESTORE_BACKUP="$backup" \
            AIPG_RESTORE_CANDIDATE="$GITHUB_WORKSPACE" \
            AIPG_RESTORE_PYTHON="$(command -v python)" \
            scripts/prove_postgres_restore.sh
      - name: Migration and schema parity
        run: |
          alembic upgrade head
          alembic check
      - name: Offline test suite (grid_api)
        # Unit tests for the on-the-money path (den, settlement merkle/ipfs,
        # recipes, payout-wallet validation). No Postgres/Redis/live API needed;
        # live integration tests live under tests/ and run separately.
        run: python -m pytest grid_api -q
