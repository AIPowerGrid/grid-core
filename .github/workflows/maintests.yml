name: grid-core tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASSWORD: grid_test
          POSTGRES_DB: grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid_test -d grid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      CREDITS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      PAYOUTS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      VALIDATORS_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
      VALIDATOR_SHADOW_TEST_DB_URL: postgresql+asyncpg://grid_test:grid_test@127.0.0.1:5432/grid_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: false
      - name: Verify production dependency lock
        run: |
          uv pip compile requirements-grid.txt \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --no-emit-index-url \
            --custom-compile-command 'uv pip compile requirements-grid.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-emit-index-url --output-file requirements-grid.lock' \
            --output-file requirements-grid.lock
          git diff --exit-code -- requirements-grid.lock
      - name: Install deps
        run: >-
          pip install --require-hashes --only-binary=:all:
          -r requirements-grid.lock && pip install pytest pytest-asyncio
      - name: Audit production dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r requirements-grid.lock --require-hashes --no-deps --disable-pip
      - name: Retired runtime gate
        run: python scripts/check_retired_runtime.py
      - name: Validate operations scripts
        run: |
          bash -n scripts/backup_postgres.sh scripts/prove_postgres_restore.sh
          grep -qx 'Group=aipg' deploy/systemd/aipg-postgres-backup.service
          # System Chrome is not a dependency of the PostgreSQL/shell checks.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -Fq 'dl.google.com/linux/chrome' "$source"; then
              echo "Excluding unused Chrome source: $source"
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client shellcheck redis-server ffmpeg bubblewrap util-linux apparmor-profiles
          shellcheck -x scripts/backup_postgres.sh scripts/prove_postgres_restore.sh deploy/bootstrap.sh
      - name: Load the distribution Bubblewrap namespace policy
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$restriction" ] && [ "$(cat "$restriction")" = 1 ]; then
            profile=/etc/apparmor.d/bwrap-userns-restrict
            if [ ! -f "$profile" ]; then
              sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict "$profile"
            fi
            sudo apparmor_parser -r "$profile"
            test "$(cat "$restriction")" = 1
          fi
      - name: Media source decoder proof
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
          python -m pytest grid_api/services/tests/test_video_sources.py grid_api/services/tests/test_media_decoder.py -q -rs
      - name: Shadow outbox Redis proof
        run: |
          set -euo pipefail
          run_dir="$(mktemp -d "${RUNNER_TEMP}/shadow-outbox.XXXXXX")"
          redis-server --port 0 --unixsocket "$run_dir/redis.sock" \
            --unixsocketperm 700 --save '' --appendonly no >"$run_dir/redis.log" 2>&1 &
          redis_pid=$!
          trap 'kill "$redis_pid" 2>/dev/null || true; wait "$redis_pid" 2>/dev/null || true; rm -rf "$run_dir"' EXIT
          for attempt in $(seq 1 50); do
            if redis-cli -s "$run_dir/redis.sock" ping >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          redis-cli -s "$run_dir/redis.sock" ping
          VALIDATOR_SHADOW_TEST_REDIS_URL="unix://$run_dir/redis.sock" \
            python -m pytest grid_api/services/tests/test_validator_shadow_collector_redis.py -q
      - name: Backup and restored migration proof
        env:
          POSTGRES_USER: grid_test
          POSTGRES_PASS: grid_test
          POSTGRES_URL: 127.0.0.1:5432/grid_test
          AIPG_RESTORE_ADMIN_USER: grid_test
          AIPG_RESTORE_ADMIN_PASS: grid_test
          AIPG_RESTORE_RUN_AS_CURRENT_USER: '1'
        run: |
          alembic upgrade 0019
          PGPASSWORD="$POSTGRES_PASS" psql \
            --host=127.0.0.1 \
            --username="$POSTGRES_USER" \
            --dbname=grid_test \
            --command='CREATE SCHEMA backup_excluded; CREATE TABLE backup_excluded.must_not_ship(id integer);'
          backup_dir="$RUNNER_TEMP/aipg-postgres-backup"
          AIPG_BACKUP_DIR="$backup_dir" scripts/backup_postgres.sh
          backup="$(find "$backup_dir" -maxdepth 1 -name 'grid-postgres-*.dump' -print -quit)"
          if pg_restore --list "$backup" | grep -q 'backup_excluded'; then
            echo 'backup unexpectedly contains a non-Grid schema' >&2
            exit 1
          fi
          AIPG_RESTORE_BACKUP="$backup" \
            AIPG_RESTORE_CANDIDATE="$GITHUB_WORKSPACE" \
            AIPG_RESTORE_PYTHON="$(command -v python)" \
            scripts/prove_postgres_restore.sh
      - name: Migration and schema parity
        run: |
          alembic upgrade head
          alembic check
      - name: Checkout reviewed media-worker adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-media-worker
          ref: 6b80591350ade4da9f7e052aa2d6dec2810ce560
          path: .integration/media-worker
          persist-credentials: false
      - name: Install the media-worker's frozen test runtime
        run: >-
          uv sync --frozen --extra test --python "$(command -v python)"
          --project .integration/media-worker
      - name: Require eight video worker interoperability cases without skips
        env:
          MEDIA_VIDEO_WORKER_SOURCE: ${{ github.workspace }}/.integration/media-worker
        run: |
          test "$(git -C "$MEDIA_VIDEO_WORKER_SOURCE" rev-parse HEAD)" = 6b80591350ade4da9f7e052aa2d6dec2810ce560
          python -m pytest \
            grid_api/services/tests/test_ltx25_appearance.py::test_core_payload_reaches_actual_worker_appearance_adapter \
            grid_api/services/tests/test_ltx25_nvfp4.py::test_actual_core_inventory_parses_in_reviewed_worker \
            grid_api/services/tests/test_video_plans.py::test_core_625_frame_sources_reach_the_reviewed_worker \
            -q -rs --junitxml="$RUNNER_TEMP/video-worker-adapter.xml"
          python - "$RUNNER_TEMP/video-worker-adapter.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).findall(".//testcase")
          assert len(cases) == 8, "four appearance, two NVFP4 and two long-source cases must execute"
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "adapter cases must pass without skips"
          PY
      - name: Offline test suite (grid_api)
        env:
          MEDIA_VIDEO_WORKER_SOURCE: ${{ github.workspace }}/.integration/media-worker
        # Disposable SQL and the pinned worker runtime exercise candidate contracts.
        # Synthetic transport is not native GPU/R2 or purchased-payment evidence.
        run: python -m pytest grid_api -q
      - name: Checkout reviewed validator client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-validator
          ref: 1c3b812236a7937824217170d95df184517228b9
          path: .integration/validator
          persist-credentials: false
      - name: Checkout reviewed Console client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-frontend
          ref: 28dbf5f348a077ed7ed163ea8e081a1eae5445a1
          path: .integration/console
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Checkout pinned Python video SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-sdk-python
          ref: 840df33c71beb69008ffc9951cda740f0a3076ee
          path: .integration/sdk-python
          persist-credentials: false
      - name: Checkout pinned JavaScript video SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIPowerGrid/grid-sdk-js
          ref: 51c04c7f27d559266f54289216ef267f6fe7a8d9
          path: .integration/sdk-js
          persist-credentials: false
      - name: Build pinned JavaScript video SDK
        working-directory: .integration/sdk-js
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: PostgreSQL Core and real HTTP video SDK qualification
        env:
          PYTHONPATH: ${{ github.workspace }}
          AIPG_JS_VIDEO_QUALIFICATION: ${{ github.workspace }}/.integration/sdk-js/qualification/core-wire.mjs
        run: python -m pytest .integration/sdk-python/qualification/test_core_video_jobs.py -q -rs
      - name: Build pinned Console for local consent integration
        working-directory: .integration/console
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Real PostgreSQL Core Console node compensation handoff
        env:
          VALIDATOR_NODE_SOURCE: ${{ github.workspace }}/.integration/validator
          VALIDATOR_CONSOLE_SOURCE: ${{ github.workspace }}/.integration/console
        run: python -m pytest grid_api/services/tests/test_validator_compensation_handoff.py -q
